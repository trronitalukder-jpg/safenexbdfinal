name: Deploy SafnexBD to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "========================================="
            echo "🚀 Starting SafnexBD Deployment"
            echo "========================================="

            # Navigate to project directory
            cd /var/www/safnexbd

            # Ensure git repo is clean and pull latest code
            echo "📥 Fetching latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # Setup Backend
            echo "📦 Building Backend..."
            cd /var/www/safnexbd/backend
            npm ci --prefer-offline --no-audit
            npx prisma generate
            npx prisma db push --skip-generate
            npm run build

            # Setup Frontend
            echo "📦 Building Frontend..."
            cd /var/www/safnexbd/frontend
            npm ci --prefer-offline --no-audit
            npm run build

            # Restart/Reload PM2 with zero downtime
            echo "🔄 Reloading PM2 Services..."
            cd /var/www/safnexbd
            pm2 startOrReload ecosystem.config.js --env production
            pm2 save

            echo "========================================="
            echo "✅ SafnexBD Deployed Successfully to VPS!"
            echo "========================================="

