<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- App Icon Background (Rounded Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Glow / Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Shield Shape -->
  <g filter="url(#shadow)">
    <path d="M 256,96 L 384,152 C 384,280 328,376 256,416 C 184,376 128,280 128,152 Z" 
          fill="url(#shieldGrad)" />
  </g>

  <!-- Inner Checkmark Symbol -->
  <path d="M 224,288 L 184,248 C 176,240 164,240 156,248 C 148,256 148,268 156,276 L 210,330 C 218,338 230,338 238,330 L 356,212 C 364,204 364,192 356,184 C 348,176 336,176 328,184 Z" 
        fill="#0284c7" />
</svg>