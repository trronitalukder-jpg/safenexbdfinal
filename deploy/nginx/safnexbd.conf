# ==============================================================================
# SafnexBD - Nginx Reverse Proxy Configuration (Multi-Site VPS Setup)
# Domain: safnexbd.com / www.safnexbd.com
# Put this in: /etc/nginx/sites-available/safnexbd.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/safnexbd.conf /etc/nginx/sites-enabled/
# Test with:   sudo nginx -t
# Reload with: sudo systemctl reload nginx
# ==============================================================================

# Upstream definitions for load balancing & connection reuse
upstream safnexbd_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream safnexbd_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# 1. HTTP Server (Redirects to HTTPS or handles Let's Encrypt challenge)
server {
    listen 80;
    listen [::]:80;
    server_name safnexbd.com www.safnexbd.com;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Main Production Block)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name safnexbd.com www.safnexbd.com;

    # SSL Certificates (Managed by Certbot: certbot --nginx -d safnexbd.com -d www.safnexbd.com)
    ssl_certificate /etc/letsencrypt/live/safnexbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safnexbd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client upload limit (avatars, KYC documents, transaction proofs)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --------------------------------------------------------------------------
    # A. Static Uploads Folder (Direct Nginx Fast Serving)
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/safnexbd/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # B. Backend API (/api/) -> NestJS Server (Port 5000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://safnexbd_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # C. WebSocket Real-Time Chat & Notifications (/socket.io/) -> Port 5000
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://safnexbd_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # D. Frontend (/ and all pages) -> Next.js Standalone (Port 3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://safnexbd_frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js streaming support
        proxy_buffering off;
    }
}
